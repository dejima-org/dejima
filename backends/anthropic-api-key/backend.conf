# Anthropic on API billing: a key rather than a subscription login. This is
# what most organisations put their people on.
#
# One backend for both places the key can live, because they are one
# arrangement. Claude Code's own console login creates a key and stores it as
# primaryApiKey in ~/.claude.json - the defaults below - and a key you hold in
# a file of your own is the same static credential read from somewhere else:
#
#     [backend.anthropic-api-key]
#     credential_file  = /path/to/your/key
#     credential_field =
#
# An empty credential_field means the whole file is the key.
#
# For a subscription login, see anthropic. That one is a genuinely different
# arrangement rather than a different location - a Bearer token that expires
# and is refreshed, against the same endpoint.

upstream        = https://api.anthropic.com
proxied_domain  = api.anthropic.com
api_style       = anthropic

credential      = static

# Anthropic's own header, and the key goes in bare - no scheme prefix. This is
# the pair the subscription backend does NOT use, which is the whole
# difference between the two: an OAuth token is a Bearer, an API key is
# x-api-key.
auth_header     = x-api-key
auth_format     = {token}

# The other slot, stripped so a placeholder cannot travel beside the injected
# key. Two answers to the same question and which one the API prefers is not
# dejima's to guess - and here the wrong answer is the placeholder.
strip_headers   = authorization

# Defaulted to where Claude Code puts it, so the common case needs no
# configuration. dejima strips this field from the copy of ~/.claude.json it
# stages, so the container gets the surrounding config and none of the key.
keys            = credential_file:path=~/.claude.json credential_field:?jsonfield=primaryApiKey
requires        = credential_file
