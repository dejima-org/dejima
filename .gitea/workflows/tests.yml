# Runs the bats suite on every pull request and on every push to one.
# `pull_request` fires on opened/reopened/synchronize, and synchronize is the
# push-to-an-open-PR event, so both are covered without listing types.
#
# Split in two because the halves cost wildly different amounts: everything
# except runtime.bats is seconds and needs nothing but a shell, while
# runtime.bats builds the image and boots real containers. Splitting means a
# typo in a doc test doesn't wait on a full image build to tell you.
name: tests

on:
  pull_request:

# No `concurrency:` block. Gitea does not implement one - the word appears
# nowhere in its actions models or services as of 1.25 - so writing it here
# would only claim a cancellation that never happens. It doesn't: pushing
# twice in a minute left the superseded run going and queued the new one
# behind it. On a single-capacity runner, expect a backlog rather than a
# supersede, and cancel the stale run by hand if it is in the way.

jobs:
  fast:
    runs-on: ubuntu-latest
    container:
      # Debian bookworm plus a node binary - node is what actions/checkout
      # needs to run at all, and apt-get is what everything below needs.
      image: node:20-bookworm
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bats jq python3 tmux ca-certificates
      - uses: actions/checkout@v4
      # As an ordinary user, not root. One test leaves a directory mode 500 and
      # asserts that the CLI's rm -rf refuses it and says so; root walks
      # through that on CAP_DAC_OVERRIDE and the test fails for a reason that
      # has nothing to do with what it checks. Nobody runs these CLIs as root.
      #
      # TERM because the job container has none, and six tests drive a real pty
      # through `script`: the picker drops colour on TERM=dumb by design, and
      # tmux will not start a client for a terminal it has no entry for, so
      # they fail on the terminal rather than on anything they mean to check.
      # xterm-256color ships in ncurses-base, which is Essential - nothing to
      # install. Set on the command rather than in env: so it survives su.
      - run: |
          chown -R node:node .
          su node -c 'TERM=xterm-256color bats test/static.bats test/project.bats test/remote.bats test/audit.bats test/proxy.bats'

  runtime:
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
      # Deliberately no `volumes:` and no `options: --network host` here. Both
      # of the things this job needs beyond an ordinary one are settled by the
      # runner, not by this file, and asking for them here does nothing:
      #
      # The docker socket, for building the image and running containers,
      # act_runner binds in by itself - GetBindsAndMounts appends
      # /var/run/docker.sock unless container.docker_host is set to "-", and
      # it adds that same path to valid_volumes on the way past. Requesting it
      # again here would at best duplicate a bind that already exists.
      #
      # The host network namespace has to come from container.network: host in
      # act_runner's config.yaml. Gitea's act fork ignores --network in a
      # workflow's container options outright (it logs "--network and --net in
      # the options will be ignored" and then overwrites NetworkMode), so this
      # is not something the repo can ask for. It is needed because of one
      # test: "a host service bound to loopback is unreachable from inside the
      # container, one bound to the bridge gateway is reachable". Its positive
      # control has bats itself bind a listener to the test network's bridge
      # gateway address, which lives on a host interface and cannot be bound
      # from any other netns - the control would fail for a reason that has
      # nothing to do with what the test asserts. That test is the containment
      # argument for the ttyd front door, so it is not one to skip in CI.
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bats jq python3 ca-certificates curl
          # The CLI only - the daemon is the host's, reached over the socket
          # above. Debian ships no docker-cli package (docker.io drags in a
          # daemon this job would never start), so take the static binary.
          curl -fsSL "https://download.docker.com/linux/static/stable/$(uname -m)/docker-${DOCKER_CLI_VERSION}.tgz" \
            | tar -xzC /usr/local/bin --strip-components=1 docker/docker
        env:
          DOCKER_CLI_VERSION: 27.5.1

      # Fails here, with the fix in the message, rather than thirty tests deep
      # in a suite that cannot work. Both of these are runner configuration,
      # not anything a change to this repo can cause.
      - name: Check the runner actually granted Docker and the host netns
        run: |
          docker info >/dev/null 2>&1 || {
            echo "No Docker daemon reachable from this job." >&2
            echo "In act_runner's config.yaml, container.docker_host must not be \"-\" - that is the" >&2
            echo "one value that stops the socket being mounted into job containers." >&2
            exit 1
          }
          # Read sysfs rather than shell out to `ip`: /sys/class/net is
          # per-netns and always there, while iproute2 is not in this image.
          # The first version of this check ran `ip -o addr show 2>/dev/null`,
          # which turned "the tool is missing" into "the host netns is
          # missing" - a check against obscure failures failing obscurely.
          [ -e /sys/class/net/docker0 ] || {
            echo "This job is not in the host network namespace - docker0 is not visible." >&2
            echo "The bridge-gateway test cannot pass here. Set container.network: host in" >&2
            echo "act_runner's config.yaml (and make sure CONFIG_FILE points the runner at" >&2
            echo "that file - without it the config is not read at all)." >&2
            exit 1
          }

      - uses: actions/checkout@v4

      # The build dominates this job, and inside setup_file it is a `docker
      # build -q` that prints nothing at all - so tens of minutes of ordinary
      # building is indistinguishable from a hang, which is exactly how it
      # read the first time this ran here. Hoisted out, it gets its own
      # progress output and its own duration in the run summary.
      #
      # SKIP_BUILD below then reuses this image rather than skipping a build.
      # The image is still built fresh from this commit, so the property the
      # test file defaults to - never assert against a stale image - holds.
      - name: Build the sandbox image
        run: docker build -t dejima:latest -f docker/Dockerfile .

      - run: bats test/runtime.bats
        env:
          SKIP_BUILD: 1
