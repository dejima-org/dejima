# OpenRouter, an OpenAI-compatible gateway in front of many models.
#
# The second provider dejima ships, and the one that makes the axis worth
# having: a hosted endpoint behind a static API key, which before #171 was the
# case dejima had no answer for. The key stays on the host and is read per
# request, exactly as the Anthropic OAuth token is.

upstream        = https://openrouter.ai/api/v1

# The name the in-container terminator answers for, and what /etc/hosts pins to
# loopback. The host alone: the path above is where requests are FORWARDED, and
# a hostname is what a certificate and a DNS pin are about.
proxied_domain  = openrouter.ai

api_style       = openai

# A key, not a login. Nothing to refresh and nothing to write back, so a 401
# here means the key is wrong rather than stale - which is why the proxy does
# not retry it.
credential      = static

auth_header     = Authorization
auth_format     = Bearer {token}

# Both spellings an OpenAI-compatible client might reach for, so a placeholder
# cannot travel beside the injected Authorization. The container only ever
# holds a placeholder; what this prevents is the placeholder being the one the
# endpoint reads.
strip_headers   = x-api-key api-key

# No default, and no assumed value: a key file's location is the operator's,
# and guessing at one would be dejima pointing at a file it has no reason to
# think exists. `requires` makes an unset one a refusal at launch rather than
# an authentication failure several layers down.
keys            = credential_file:?path
requires        = credential_file
