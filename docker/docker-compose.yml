# Not meant to be run directly with plain `docker compose up`: WORKSPACE_DIR,
# SSH_AUTH_SOCK, etc. must point at real host paths for a specific project.
# Use `bin/claude-sandbox <path-to-project>` instead, which sets these and
# invokes this file.
services:
  claude:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        TZ: ${TZ:-UTC}
        # Matches the container's own user to the real host user - see
        # Dockerfile. Defaults reproduce today's node/1000/1000//home/node
        # exactly if these aren't set (e.g. building directly, bypassing
        # bin/claude-sandbox).
        SANDBOX_USER: ${SANDBOX_USER:-node}
        SANDBOX_UID: ${SANDBOX_UID:-1000}
        SANDBOX_GID: ${SANDBOX_GID:-1000}
        SANDBOX_HOME: ${HOME:-/home/node}
    # Tagged per-user, not a fixed :latest - bin/claude-sandbox always
    # passes --build, and two different accounts on a shared devbox
    # building from their own checkouts would otherwise silently overwrite
    # each other's image under the same tag.
    image: claude-sandbox:${SANDBOX_USER:-node}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      GITEA_SSH_HOST: ${GITEA_SSH_HOST:-}
      GITEA_API: ${GITEA_API:-}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      # Read-only fine-grained GitHub PAT (Contents + Metadata: read-only,
      # no write scopes). Used by `gh` and, via `gh auth setup-git`, by git
      # itself for github.com over HTTPS - see the firewall/Dockerfile for
      # why that's the only path GitHub is reachable through at all.
      GH_TOKEN: ${GH_TOKEN:-}
      # Points git at the gitconfig copy mounted below instead of the
      # default ~/.gitconfig - see that mount's comment for why it can't
      # just live at ~/.gitconfig directly.
      GIT_CONFIG_GLOBAL: ${HOME}/.gitconfig-sandbox/.gitconfig
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
      # What actually runs as the sandbox user - defaults to bare `claude`.
      # See entrypoint.sh and bin/claude-sandbox's SANDBOX_NVIM_CONFIG.
      SANDBOX_CMD: ${SANDBOX_CMD:-claude}
      # Opt-in escape hatch from the default hard GitHub-push block - see
      # init-firewall.sh and git-push-guard.sh. Off unless explicitly set.
      ALLOW_GITHUB_PUSH: ${ALLOW_GITHUB_PUSH:-0}
      # Base URL of a Loki push endpoint (e.g. http://192.0.2.11:3100) to
      # ship DNS-query and firewall allow/reject logs to. Its host is
      # automatically firewall-allowlisted (see entrypoint.sh). Optional -
      # logging is skipped entirely if unset.
      LOKI_URL: ${LOKI_URL:-}
      SSH_AUTH_SOCK: /ssh-agent
      ENABLE_FIREWALL: ${ENABLE_FIREWALL:-1}
      # Docker's own tty allocation defaults to a generic TERM (e.g. plain
      # "xterm", dropping 256-color and any extended-keys terminfo bits),
      # not whatever the host's actual terminal/tmux session is using.
      # Forward the real value so nvim negotiates key sequences (e.g. the
      # Ctrl-H/Backspace disambiguation config/tmux.conf sets up) against
      # the terminfo entry the rest of the chain actually expects.
      TERM: ${TERM:-xterm-256color}
    volumes:
      # Mounted at the same absolute path as on the host (rather than a
      # fixed /workspace) so Claude Code's project/session-history keying
      # (based on cwd) lines up with the host, letting a session started
      # here be resumed on the host with `claude --resume`.
      - ${WORKSPACE_DIR:?set WORKSPACE_DIR to the project directory to mount}:${WORKSPACE_DIR}
      - ${HOME}/.claude:${HOME}/.claude
      # settings.json/CLAUDE.md/plugins are config and hook/plugin *code*,
      # not runtime state - hooks run automatically with no approval gate,
      # so a compromised session writing to them would plant something that
      # then executes unsandboxed on the host next time Claude Code starts
      # there. Layer them back read-only on top of the read-write parent
      # mount above (Docker applies more specific mounts on top of broader
      # ones); everything else under ~/.claude (session/project history,
      # credentials refresh, caches, etc.) still needs to stay read-write.
      #
      # settings.json specifically comes from $SANDBOX_SETTINGS_FILE (a
      # bin/claude-sandbox-generated copy with sandbox.enabled forced to
      # false), not the real file directly - Claude Code's own internal
      # per-command sandboxing is redundant on top of this container (and
      # can't actually function inside it anyway), and mounting it read-only
      # means it can't be patched from inside, so the substitution has to
      # happen on the host before the container ever starts.
      - ${SANDBOX_SETTINGS_FILE:?set by bin/claude-sandbox}:${HOME}/.claude/settings.json:ro
      - ${HOME}/.claude/CLAUDE.md:${HOME}/.claude/CLAUDE.md:ro
      - ${HOME}/.claude/plugins:${HOME}/.claude/plugins:ro
      # ~/.claude/hooks holds hook *code* too (install.sh symlinks this
      # repo's hooks/ files into it) - same rationale as settings.json/
      # CLAUDE.md/plugins above, but for a gap those three don't cover:
      # without this, the directory itself stays part of the read-write
      # ~/.claude mount, so a compromised session could unlink one of
      # install.sh's symlinks and drop a plain file in its place. The
      # dynamic per-symlink-target mounts bin/claude-sandbox adds at
      # launch (see below) only protect targets that resolve *outside*
      # ~/.claude - they never cover this directory itself, and a plain
      # file dropped here wouldn't be a symlink for that logic to even
      # notice. That file would then run unsandboxed on the host as a
      # hook the next time Claude Code starts there - the same
      # persistence path the other three overlays exist to close.
      - ${HOME}/.claude/hooks:${HOME}/.claude/hooks:ro
      # A throwaway per-session copy, not the real file - see
      # bin/claude-sandbox and README "Throwaway ~/.claude.json". A plain
      # read-only mount hangs Claude Code on startup (it writes to this
      # file before login completes), so this can't just be layered
      # read-only the way settings.json/CLAUDE.md/plugins/hooks are above;
      # a generated, discarded copy is what actually stops a compromised
      # session's changes (e.g. a malicious mcpServers entry) from ever
      # reaching the real file.
      - ${SANDBOX_CLAUDE_JSON_FILE:?set by bin/claude-sandbox}:${HOME}/.claude.json
      # ~/.claude/CLAUDE.md (mounted above) tells agents to write specs to
      # ~/specs/ rather than a project-local path - that instruction is
      # already in effect inside the container (CLAUDE.md carries over), so
      # the directory it points at needs to actually exist and be writable
      # here too, or an agent following it just writes into an ephemeral
      # path inside the container that vanishes with the session.
      - ${HOME}/specs:${HOME}/specs
      # Global git identity (user.name/user.email) - a throwaway copy of it,
      # in its own directory rather than a single file bind-mounted at
      # ~/.gitconfig: entrypoint.sh's `gh auth setup-git` writes a
      # credential-helper entry into it via git's usual write-temp-then-
      # rename pattern, which fails on a single-file mount ("Device or
      # resource busy" - Linux won't let that mount point's backing inode be
      # replaced). GIT_CONFIG_GLOBAL above points git at the file inside
      # this directory instead. See bin/claude-sandbox - nothing written
      # here ever reaches the user's real ~/.gitconfig.
      - ${SANDBOX_GITCONFIG_DIR:?set by bin/claude-sandbox}:${HOME}/.gitconfig-sandbox
      # ~/.claude/hooks contains symlinks whose targets live outside
      # ~/.claude itself (this repo's hooks/, and potentially others, e.g.
      # another config repo's hooks/) - those targets are bind-mounted at
      # their own real host paths dynamically by bin/claude-sandbox at
      # launch (it inspects the symlinks and appends the exact mounts
      # needed), not listed statically here, since this repo can't assume
      # what else might be installed on a given host.
      - claude-code-bashhistory:/commandhistory
      - nvim-data:${HOME}/.local/share/nvim
      - nvim-state:${HOME}/.local/state/nvim
      - nvim-cache:${HOME}/.cache/nvim
      # Required only if SANDBOX_SSH_KEY isn't set - bin/claude-sandbox
      # itself enforces that at least one of the two is present.
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
      - ${SSH_KNOWN_HOSTS:-/dev/null}:${HOME}/.ssh/known_hosts:ro
      # Dedicated, purpose-built key for headless git push - see README
      # "Headless git push without agent forwarding". Read-only single-file
      # mount is fine here (unlike the gitconfig mount above): nothing in
      # the container ever writes to this file. Mounted under /root (700,
      # root:root by default), not under $SANDBOX_HOME: the sandbox user's
      # UID now matches the host user's (see Dockerfile), so a mount here
      # under their own home would leave the raw key readable by that user
      # for the container's whole life, even after entrypoint.sh's copy is
      # deleted - only root (which loads it into the agent, then never
      # touches it again) can reach this path.
      - ${SANDBOX_SSH_KEY_FILE:-/dev/null}:/root/.ssh-sandbox-key-src:ro
      # Read-write scratch space for passing files back and forth with the
      # sandboxed session (screenshots, temp scripts) without touching the
      # actual project checkout - separate from WORKSPACE_DIR above, and a
      # real host directory (not a named volume) so it's actually visible on
      # both sides, persisting across sessions.
      - ${SANDBOX_SHARE_DIR}:${HOME}/shared
    working_dir: ${WORKSPACE_DIR}
    stdin_open: true
    tty: true

volumes:
  claude-code-bashhistory:
  nvim-data:
  nvim-state:
  nvim-cache:
