install            = npm:@anthropic-ai/claude-code
image_dirs         = .claude .claude/projects .claude/file-history
image_files        = .claude/.credentials.json
image_env          = CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
command            = claude
command_path       = /usr/local/share/npm-global/bin/claude
api_domains        = platform.claude.com
guards             = bash-deny push-guard merge-guard notify

# Anthropic's Messages API and nothing else. Claude Code speaks one dialect, so
# pairing it with an OpenAI-compatible provider is refused at launch rather
# than producing well-formed requests in the wrong shape.
api_styles         = anthropic
no_confirm_args    = --dangerously-skip-permissions
briefing_args      = --append-system-prompt
settings_args      = --settings /etc/dejima-settings.json
# Which model API this harness talks to, and so which credential the host-side
# proxy injects. Per harness rather than global (#171): an operator running
# Claude Code against Anthropic and Cline against something else is the
# ordinary case, and one setting cannot say both.
#
# NO DEFAULT, for the reason [core] harness has none. A default that could ever
# change is a config file that is not the source of truth: a session whose
# config did not change must not start talking to a different endpoint because
# dejima's idea of a sensible one moved.
keys               = provider:?provider:provider projects_dir:path=~/.claude/projects file_history_dir:path=~/.claude/file-history statusline_path:path=~/.claude/statusline.sh

# What this harness was talking to before the key existed, WRITTEN INTO the
# operator's config the first time a launch finds it unset - not resolved as a
# default on every read.
#
# The difference is the whole point. A default is dejima's answer, re-decided
# every launch, and changing it later moves a session whose config never
# changed. A migration is the operator's answer, recorded once: after it runs,
# nothing dejima decides later can move them.
#
# Safe to state here because it is not a guess. Claude Code against Anthropic
# is what every existing session already was, so writing it down changes
# nothing about the launch it runs in.
assumed_provider   = anthropic
resume_command     = claude --resume {{session_id}}
briefing           = briefing.md
