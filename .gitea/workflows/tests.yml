# Runs the bats suite on every pull request and on every push to one.
# `pull_request` fires on opened/reopened/synchronize, and synchronize is the
# push-to-an-open-PR event, so both are covered without listing types.
#
# Split by what each half NEEDS, not by what it costs. Everything except
# runtime.bats runs anywhere a shell does, including inside a dejima sandbox -
# which is where this repo is normally worked on. runtime.bats builds the image
# and boots real containers, so it needs a Docker daemon the sandbox
# deliberately does not have. That constraint is what a contributor has to
# reason about when deciding what they can run before pushing, so the jobs are
# named for the runner tier they need: `confined` for the ones a shell can
# run anywhere, `privileged` for the one that needs a daemon.
#
# The confined half is a matrix over its files rather than one invocation. The
# files are independent, so running them together only serialised them: wall
# clock was their sum rather than the slowest one. It also means a failure
# names the suite that failed in the job list, instead of one red check
# covering every unrelated area at once.
name: tests

# pull_request_target, not pull_request, and the difference is the whole
# security posture of this file.
#
# Under `pull_request` the workflow is read from the HEAD of the pull request -
# so the branch under test decides what runs and, critically, `runs-on:`. A
# branch can point its jobs at any runner its repository can reach, which
# means every control the runner provides (no Docker socket, deny-by-default
# egress) is opt-out by whoever wrote the branch.
#
# Under `pull_request_target` Gitea reads the workflow from the BASE branch,
# and explicitly discards any pull_request_target workflow found on the head
# commit - so a branch can neither edit this file's copy nor introduce its
# own. What runs here, and where, is whatever `main` says.
#
# The cost is that the checkout no longer defaults to the code under test: the
# run's ref is the base branch. Every job that means to test the branch has to
# say so, which is why the checkouts below carry an explicit ref. A bare
# checkout here would test `main` on every pull request and pass regardless of
# the change - green checks that mean nothing.
#
# This does NOT make the repository safe on its own. A branch can still add a
# workflow of its own with `on: pull_request`, and that runs from the head
# with whatever `runs-on:` it likes. The only thing stopping that is which
# runners the repository can reach at all - see docs/ci.md, "A label is not a
# boundary". What this buys is that the intended CI is trustworthy, and that
# escaping it requires adding a file rather than editing one.
on:
  pull_request_target:

# No `concurrency:` block. Gitea does not implement one - the word appears
# nowhere in its actions models or services as of 1.25 - so writing it here
# would only claim a cancellation that never happens. It doesn't: pushing
# twice in a minute left the superseded run going and queued the new one
# behind it. On a single-capacity runner, expect a backlog rather than a
# supersede, and cancel the stale run by hand if it is in the way.

jobs:
  confined:
    # A label carried only by a runner configured for this - see ci/ and
    # docs/ci.md. Not a generic one, even though these suites genuinely do run
    # anywhere a shell does, because "runs anywhere" is a statement about what
    # the job needs and not about what it should be handed.
    #
    # Whether a job container gets the Docker socket is a property of the
    # runner's config.yaml (container.docker_host), not of anything this file
    # can ask for or refuse. So a job that needs nothing still receives
    # whatever its runner grants everything it runs, and naming a specific
    # label is the only way this file gets a say in which runner that is.
    #
    # If no runner carries this label, these jobs queue. That is the intended
    # failure: it is a better one than a green run on a host that grants
    # everything.
    runs-on: dejima-confined
    strategy:
      # One suite per job. fail-fast off because these cover unrelated areas -
      # cancelling the other six on the first failure would hide whether a
      # change broke one thing or all of them, which is the question a review
      # actually needs answered.
      fail-fast: false
      matrix:
        suite:
          - static
          - launch
          - project
          - remote
          - audit
          - proxy
          - config
          - providers
          - conversation
          - share
    name: confined (${{ matrix.suite }})
    container:
      # Debian bookworm plus a node binary - node is what actions/checkout
      # needs to run at all, and apt-get is what everything below needs.
      image: node:20-bookworm
    steps:
      # Before apt, because apt's failure for this says "Unable to locate
      # package bats" and nothing about why. On a runner behind the egress
      # allowlist a name that does not resolve is the resolver or the
      # allowlist, not the package - and ci-runner.bats, which would say so
      # precisely, cannot run yet because installing it is what just failed.
      #
      # Retried rather than decided on one attempt: a resolver can be a moment
      # behind a container's start, and apt itself retries, so failing a whole
      # job on a single lookup would be stricter than the step it is
      # protecting. Six attempts over ~15s, then a diagnosis.
      #
      # Uses only what the image already has: getent is libc, and the
      # resolver's address is in resolv.conf.
      - name: Check the job network can resolve before installing anything
        run: |
          for attempt in 1 2 3 4 5 6; do
            if getent hosts deb.debian.org >/dev/null 2>&1; then
              [ "$attempt" -eq 1 ] || echo "resolved on attempt $attempt"
              exit 0
            fi
            sleep 3
          done
          echo "deb.debian.org did not resolve after 6 attempts, so this job" >&2
          echo "cannot install anything." >&2
          echo "" >&2
          echo "This job's resolver:" >&2
          sed -n 's/^nameserver/  nameserver/p' /etc/resolv.conf >&2
          echo "" >&2
          echo "If other jobs in this same run resolved fine, the runners are" >&2
          echo "configured differently: check that EVERY runner answering this" >&2
          echo "label has --dns=<gateway> in container.options and the same" >&2
          echo "container.network. A runner missing it fails only the jobs that" >&2
          echo "happen to land on it, which looks intermittent." >&2
          echo "" >&2
          echo "If every job failed, check on the runner host, in order:" >&2
          echo "  dejima-ci-allowlist show      - a server= line for this name?" >&2
          echo "  systemctl status dnsmasq      - running?" >&2
          echo "  iptables -S DEJIMA-CI-IN      - port 53 allowed from the bridge?" >&2
          echo "  journalctl -u dnsmasq -n 50   - does the query arrive, and is it" >&2
          echo "                                  forwarded without a reply?" >&2
          exit 1

      - name: Install test dependencies
        run: |
          apt-get update
          # iproute2 for `ss`: the one test asserting dejima-ttyd refuses to
          # start when something already holds its port skips without it, and a
          # permanent skip on the check guarding a reverse-proxy port takeover
          # is the same as not having it.
          apt-get install -y --no-install-recommends bats jq python3 tmux ca-certificates iproute2
      # The code under test, named explicitly - see the header. Without `ref`
      # this checks out the base branch and the suite passes without ever
      # seeing the change.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # As an ordinary user, not root. One test leaves a directory mode 500 and
      # asserts that the CLI's rm -rf refuses it and says so; root walks
      # through that on CAP_DAC_OVERRIDE and the test fails for a reason that
      # has nothing to do with what it checks. Nobody runs these CLIs as root.
      #
      # TERM because the job container has none, and six tests drive a real pty
      # through `script`: the picker drops colour on TERM=dumb by design, and
      # tmux will not start a client for a terminal it has no entry for, so
      # they fail on the terminal rather than on anything they mean to check.
      # xterm-256color ships in ncurses-base, which is Essential - nothing to
      # install. Set on the command rather than in env: so it survives su.
      #
      # --jobs runs the tests within the file concurrently. bats needs GNU
      # parallel only to parallelize ACROSS files; within one file it uses its
      # own flock-based semaphore, and flock is in util-linux, which Debian
      # marks Essential - so nothing here has to install anything for it.
      # --no-parallelize-across-files is what tells bats that, since it
      # otherwise refuses --jobs outright when GNU parallel is absent.
      - run: |
          chown -R node:node .
          su node -c "TERM=xterm-256color bats --jobs $(nproc) --no-parallelize-across-files test/${{ matrix.suite }}.bats"

  shellcheck:
    # Its own job rather than a matrix entry: it installs a different package,
    # runs one command over the whole repo instead of one suite, and a lint
    # failure should read as "lint" in the run list rather than as a suite name
    # that happens to be a linter.
    #
    # static.bats does a great deal of grep-based invariant checking, but that
    # is a different class of check - it asks whether a specific known thing is
    # still true, and this asks whether any of a catalogue of shell hazards is
    # present. The word-splitting bug in docker/fixed-domains.sh that shipped
    # in #144 is exactly what the second kind catches and the first does not.
    runs-on: dejima-confined
    name: confined (shellcheck)
    container:
      image: node:20-bookworm
    steps:
      - name: Install shellcheck
        run: |
          apt-get update
          apt-get install -y --no-install-recommends shellcheck ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # The file list lives in the script, so this job and the static test that
      # pins its coverage cannot disagree about what is checked.
      - run: bash test/shellcheck.sh

  privileged:
    # A different label from the job above, and the only one in this file that
    # asks for anything privileged. This job needs the host network namespace,
    # the Docker socket and the shared volume below, none of which a workflow
    # can request - they are granted by the runner or not at all, so on a
    # runner without them it fails the preflight check outright.
    #
    # A label carried by exactly one configured runner makes landing somewhere
    # unusable unrepresentable rather than merely diagnosable: no runner
    # matching it means this queues instead of running somewhere it cannot
    # work. A generic label would make which runner picked it up a coin flip.
    #
    # The runner behind this label can be taken by anything it runs (see
    # ci/act-runner-runtime.example.yaml), so it belongs on a host that exists
    # for that and holds nothing else.
    runs-on: dejima-privileged
    container:
      image: node:20-bookworm
      # One volume, and it is load-bearing - see TMPDIR on the bats step for
      # what it is for. It has to be listed in container.valid_volumes in
      # act_runner's config.yaml too: a volume this file asks for and the
      # runner has not been told to allow does not arrive.
      volumes:
        - /tmp/dejima-ci:/tmp/dejima-ci
      # Nothing else, though - no `options: --network host`, and no request
      # for the docker socket. Both of the other things this job needs beyond
      # an ordinary one are settled by the runner, not by this file, and
      # asking for them here does nothing:
      #
      # The docker socket, for building the image and running containers,
      # act_runner binds in by itself - GetBindsAndMounts appends
      # /var/run/docker.sock unless container.docker_host is set to "-", and
      # it adds that same path to valid_volumes on the way past. Requesting it
      # again here would at best duplicate a bind that already exists.
      #
      # The host network namespace has to come from container.network: host in
      # act_runner's config.yaml. Gitea's act fork ignores --network in a
      # workflow's container options outright (it logs "--network and --net in
      # the options will be ignored" and then overwrites NetworkMode), so this
      # is not something the repo can ask for. It is needed because of one
      # test: "a host service bound to loopback is unreachable from inside the
      # container, one bound to the bridge gateway is reachable". Its positive
      # control has bats itself bind a listener to the test network's bridge
      # gateway address, which lives on a host interface and cannot be bound
      # from any other netns - the control would fail for a reason that has
      # nothing to do with what the test asserts. That test is the containment
      # argument for the ttyd front door, so it is not one to skip in CI.
    steps:
      # Before apt, because apt's failure for this says "Unable to locate
      # package bats" and nothing about why. On a runner behind the egress
      # allowlist a name that does not resolve is the resolver or the
      # allowlist, not the package - and ci-runner.bats, which would say so
      # precisely, cannot run yet because installing it is what just failed.
      #
      # Retried rather than decided on one attempt: a resolver can be a moment
      # behind a container's start, and apt itself retries, so failing a whole
      # job on a single lookup would be stricter than the step it is
      # protecting. Six attempts over ~15s, then a diagnosis.
      #
      # Uses only what the image already has: getent is libc, and the
      # resolver's address is in resolv.conf.
      - name: Check the job network can resolve before installing anything
        run: |
          for attempt in 1 2 3 4 5 6; do
            if getent hosts deb.debian.org >/dev/null 2>&1; then
              [ "$attempt" -eq 1 ] || echo "resolved on attempt $attempt"
              exit 0
            fi
            sleep 3
          done
          echo "deb.debian.org did not resolve after 6 attempts, so this job" >&2
          echo "cannot install anything." >&2
          echo "" >&2
          echo "This job's resolver:" >&2
          sed -n 's/^nameserver/  nameserver/p' /etc/resolv.conf >&2
          echo "" >&2
          echo "If other jobs in this same run resolved fine, the runners are" >&2
          echo "configured differently: check that EVERY runner answering this" >&2
          echo "label has --dns=<gateway> in container.options and the same" >&2
          echo "container.network. A runner missing it fails only the jobs that" >&2
          echo "happen to land on it, which looks intermittent." >&2
          echo "" >&2
          echo "If every job failed, check on the runner host, in order:" >&2
          echo "  dejima-ci-allowlist show      - a server= line for this name?" >&2
          echo "  systemctl status dnsmasq      - running?" >&2
          echo "  iptables -S DEJIMA-CI-IN      - port 53 allowed from the bridge?" >&2
          echo "  journalctl -u dnsmasq -n 50   - does the query arrive, and is it" >&2
          echo "                                  forwarded without a reply?" >&2
          exit 1

      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bats jq python3 ca-certificates curl
          # The CLI only - the daemon is the host's, reached over the socket
          # above. Debian ships no docker-cli package (docker.io drags in a
          # daemon this job would never start), so take the static binary.
          curl -fsSL "https://download.docker.com/linux/static/stable/$(uname -m)/docker-${DOCKER_CLI_VERSION}.tgz" \
            | tar -xzC /usr/local/bin --strip-components=1 docker/docker
          # buildx ships separately from that tarball, and `docker build` picks
          # the builder by whether this plugin is present: with it, BuildKit;
          # without it, the legacy builder, which creates, commits and removes a
          # real container per instruction. That cost ~10s x 56 steps here - more
          # of the build than the downloads and compiles it was wrapping.
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-buildx \
            "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-$(dpkg --print-architecture)"
          chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
          # Because that choice is silent, check it rather than assume it. A
          # download that returned an error page instead of a binary still
          # chmods fine, and the only symptom would be the slow builds this is
          # meant to fix - which look like nothing being wrong.
          docker buildx version || {
            echo "The buildx plugin did not load, so docker build would quietly use the" >&2
            echo "legacy builder instead of BuildKit. Check the download URL above still" >&2
            echo "resolves for this architecture." >&2
            exit 1
          }
          # compose, from the same place and for a reason of the same kind: it
          # is a plugin, so without it `docker compose` is not a command at
          # all. Every launch on a real host goes through one, and nothing in
          # CI did - so the compose file was the one input to a launch that no
          # job had ever parsed.
          #
          # Its assets are named for `uname -m`, like the CLI tarball above and
          # unlike buildx, which uses the Debian architecture name.
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-$(uname -m)"
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          # Checked for the same reason buildx is: an error page chmods just as
          # well as a binary, and the symptom would be a test that skips rather
          # than one that fails.
          docker compose version || {
            echo "The compose plugin did not load, so the compose-file test will skip" >&2
            echo "instead of running. Check the download URL above still resolves for" >&2
            echo "this architecture." >&2
            exit 1
          }
        env:
          DOCKER_CLI_VERSION: 27.5.1
          BUILDX_VERSION: 0.36.0
          COMPOSE_VERSION: 5.5.1

      # Fails here, with the fix in the message, rather than thirty tests deep
      # in a suite that cannot work. Both of these are runner configuration,
      # not anything a change to this repo can cause.
      - name: Check the runner granted Docker, the host netns, and a shared /tmp
        run: |
          docker info >/dev/null 2>&1 || {
            echo "No Docker daemon reachable from this job." >&2
            echo "In act_runner's config.yaml, container.docker_host must not be \"-\" - that is the" >&2
            echo "one value that stops the socket being mounted into job containers." >&2
            exit 1
          }
          # Read sysfs rather than shell out to `ip`: /sys/class/net is
          # per-netns and always there, while iproute2 is not in this image.
          # The first version of this check ran `ip -o addr show 2>/dev/null`,
          # which turned "the tool is missing" into "the host netns is
          # missing" - a check against obscure failures failing obscurely.
          [ -e /sys/class/net/docker0 ] || {
            echo "This job is not in the host network namespace - docker0 is not visible." >&2
            echo "The bridge-gateway test cannot pass here. Set container.network: host in" >&2
            echo "act_runner's config.yaml (and make sure CONFIG_FILE points the runner at" >&2
            echo "that file - without it the config is not read at all)." >&2
            exit 1
          }
          # Probe the shared directory the same way the suite will use it:
          # write a file in here, read it back through the host daemon. If it
          # is not really shared, the daemon invents an empty directory for
          # the mount rather than refusing it, and the probe comes back empty
          # - which is exactly how all of runtime.bats would fail. Reuses
          # this job's own image, so there is nothing to pull.
          mkdir -p /tmp/dejima-ci
          # bats only clears its own tmpdir on a normal exit, so fixtures
          # from a killed run would otherwise pile up on the host forever.
          # `find -delete` rather than a glob: it covers dotfiles, doesn't
          # misfire on an empty directory, and still fails loudly.
          find /tmp/dejima-ci -mindepth 1 -delete
          echo shared-ok > /tmp/dejima-ci/probe
          probe=$(docker run --rm -v /tmp/dejima-ci/probe:/probe:ro node:20-bookworm cat /probe 2>/dev/null || true)
          [ "$probe" = shared-ok ] || {
            echo "/tmp/dejima-ci is not shared with the host - the probe read back empty." >&2
            echo "Add it to container.valid_volumes in act_runner's config.yaml. Without" >&2
            echo "that the runner drops the volume this job asks for, and every fixture" >&2
            echo "mount in runtime.bats silently becomes an empty directory instead." >&2
            exit 1
          }

      # The token raises the api.github.com/meta ceiling from 60 requests an
      # hour to 5000, and nothing about a run looks different when it stops
      # doing that. A misspelled secret name, a revoked token and an expiry a
      # year from now all present identically: green for a while, then
      # containers failing to boot in docker/egress-policy - which reads as a
      # regression in the firewall rather than as a lapsed credential. So ask
      # the API what the ceiling actually is, rather than checking that a
      # variable is non-empty and assuming the rest.
      - name: Check the GitHub ranges lookup is authenticated
        env:
          GH_TOKEN: ${{ secrets.GH_META_TOKEN }}
        run: |
          # Not a failure. Without the secret the suite still runs, it just
          # spends the anonymous quota - which is the right default for a
          # fork, and only a problem once runs get frequent.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "No GH_META_TOKEN secret is configured, so GitHub's IP ranges will be"
            echo "fetched anonymously: 60 requests an hour for this entire runner host,"
            echo "against thirteen container starts per run. Fine occasionally, and on a"
            echo "busy day the containers stop booting instead. See issue #37."
            exit 0
          fi
          # No -f. A rejected token still answers with the header this reads,
          # and the anonymous ceiling it reports is a far better diagnostic
          # than curl exiting silently on the 401.
          limit=$(curl -sI --connect-timeout 10 -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/meta | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="x-ratelimit-limit" {print $2}')
          if [ -z "$limit" ]; then
            echo "No x-ratelimit-limit came back from api.github.com/meta at all, so the" >&2
            echo "request itself did not complete. This one is about reachability from" >&2
            echo "the runner, not about the token." >&2
            exit 1
          fi
          if [ "$limit" -lt 5000 ]; then
            echo "GH_META_TOKEN is set, but GitHub reports a ceiling of $limit/hour - that" >&2
            echo "is the anonymous quota, so the token is not being accepted. Expired or" >&2
            echo "revoked is the likely cause; a wrong secret name would have arrived" >&2
            echo "empty and been reported above instead. Replace it with a fine-grained" >&2
            echo "PAT with no permissions - /meta is public data and needs none." >&2
            exit 1
          fi
          echo "GitHub ranges lookup is authenticated - ceiling is $limit requests/hour."

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # The build dominates this job, and inside setup_file it is a `docker
      # build -q` that prints nothing at all - so tens of minutes of ordinary
      # building is indistinguishable from a hang, which is exactly how it
      # read the first time this ran here. Hoisted out, it gets its own
      # progress output and its own duration in the run summary.
      #
      # SKIP_BUILD below then reuses this image rather than skipping a build.
      # The image is still built fresh from this commit, so the property the
      # test file defaults to - never assert against a stale image - holds.
      # Named under localhost/ so a stray push cannot resolve to Docker Hub,
      # like every other image this repo builds (#53).
      #
      # This step and runtime.bats must agree on that name, and they come from
      # different commits: this file is read from the BASE branch (see the
      # pull_request_target note at the top) while the checkout above is the
      # branch under test. So a rename here lands in two steps - the base
      # tagging both names first, then this - and a future one has to do the
      # same. A single pull request that changes both sides fails, because the
      # half that runs is the half it did not change.
      - name: Build the sandbox image
        run: docker build -t localhost/dejima:latest -f docker/Dockerfile .

      # -T prints each test's duration. This job is the slow one and the only
      # one nobody can run locally, so without it the cost of a test is
      # guesswork - and the guess is wrong, because the expensive tests here are
      # the ones that build an image rather than the ones that assert the most.
      # Serial execution (see below) makes the numbers straightforwardly
      # additive.
      #
      # Not --jobs, unlike the confined half. One container is shared across
      # this file and a handful of tests mutate it - signalling dnsmasq,
      # reloading the address sets - so running tests concurrently would have
      # them racing over state the others read. Parallelising this suite means
      # first separating the tests that only read the shared container from the
      # ones that change it, which is a larger change than a flag.
      - run: bats -T test/runtime.bats
        env:
          SKIP_BUILD: 1
          # Every container this suite starts fetches GitHub's IP ranges from
          # api.github.com/meta (fetch_forge_ranges in docker/egress-policy),
          # and unauthenticated that
          # endpoint allows 60 requests an hour per source IP - shared with
          # everything else on this runner host. Thirteen starts per run means
          # two runs an hour exhausts it, after which containers fail to boot
          # and tests fail on the quota rather than on anything they assert.
          #
          # This became reachable when the build got fast: at ~48 minutes a
          # run the starts were spread thin enough to stay under, and at ~4
          # minutes they are not. Any token authenticates the fetch and raises
          # the ceiling to 5000/hour; /meta is public data and needs no scopes
          # at all, so the secret behind this should be a fine-grained PAT
          # with no permissions and no repository access - not a token that
          # can do anything else. It reaches `gh auth setup-git` inside the
          # containers, so a scope granted here is a scope handed to every
          # sandbox the suite starts.
          #
          # Unset is fine and the suite still runs - it just spends the
          # anonymous quota, so expect the failure above on a busy day.
          GH_TOKEN: ${{ secrets.GH_META_TOKEN }}
          # runtime.bats builds fixtures on disk - ssh keys, statusline
          # scripts, .claude.json copies, a proxy socket - and bind-mounts
          # them into containers it starts. Those containers are siblings of
          # this one rather than children: the host daemon creates them, over
          # the socket, so it resolves every -v source against the host's
          # filesystem and not this container's. A fixture at a path that
          # exists only in here therefore does not resolve - and Docker's
          # answer to a missing bind source is not an error, it is to create
          # an empty directory and mount that. Seven tests failed that way,
          # and an eighth passed while being just as broken, because an empty
          # read-only directory satisfies exactly what it asserts.
          #
          # Pointing TMPDIR at the shared mount puts `mktemp -d` and bats'
          # own BATS_*_TMPDIR on paths that mean the same thing on both sides
          # of the socket, which is all any of those mounts need.
          TMPDIR: /tmp/dejima-ci

  # The runner's own configuration, asserted from inside a job on it. Separate
  # jobs rather than steps on the two above, because the point is that these
  # are two different runners and either can be wrong on its own - one red
  # check per tier says which.
  #
  # These fail on how the RUNNER is configured, not on anything in a pull
  # request. A red check here means the machine needs attention; it does not
  # mean the branch does.
  runner-env-confined:
    runs-on: dejima-confined
    name: runner-env (confined)
    container:
      image: node:20-bookworm
    steps:
      # Before apt, because apt's failure for this says "Unable to locate
      # package bats" and nothing about why. On a runner behind the egress
      # allowlist a name that does not resolve is the resolver or the
      # allowlist, not the package - and ci-runner.bats, which would say so
      # precisely, cannot run yet because installing it is what just failed.
      #
      # Retried rather than decided on one attempt: a resolver can be a moment
      # behind a container's start, and apt itself retries, so failing a whole
      # job on a single lookup would be stricter than the step it is
      # protecting. Six attempts over ~15s, then a diagnosis.
      #
      # Uses only what the image already has: getent is libc, and the
      # resolver's address is in resolv.conf.
      - name: Check the job network can resolve before installing anything
        run: |
          for attempt in 1 2 3 4 5 6; do
            if getent hosts deb.debian.org >/dev/null 2>&1; then
              [ "$attempt" -eq 1 ] || echo "resolved on attempt $attempt"
              exit 0
            fi
            sleep 3
          done
          echo "deb.debian.org did not resolve after 6 attempts, so this job" >&2
          echo "cannot install anything." >&2
          echo "" >&2
          echo "This job's resolver:" >&2
          sed -n 's/^nameserver/  nameserver/p' /etc/resolv.conf >&2
          echo "" >&2
          echo "If other jobs in this same run resolved fine, the runners are" >&2
          echo "configured differently: check that EVERY runner answering this" >&2
          echo "label has --dns=<gateway> in container.options and the same" >&2
          echo "container.network. A runner missing it fails only the jobs that" >&2
          echo "happen to land on it, which looks intermittent." >&2
          echo "" >&2
          echo "If every job failed, check on the runner host, in order:" >&2
          echo "  dejima-ci-allowlist show      - a server= line for this name?" >&2
          echo "  systemctl status dnsmasq      - running?" >&2
          echo "  iptables -S DEJIMA-CI-IN      - port 53 allowed from the bridge?" >&2
          echo "  journalctl -u dnsmasq -n 50   - does the query arrive, and is it" >&2
          echo "                                  forwarded without a reply?" >&2
          exit 1

      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bats python3 ca-certificates
      # No `ref:` here, deliberately - unlike the suites above. These assert on
      # the RUNNER, not on the change, so the assertions should come from the
      # base branch rather than from the branch they are meant to hold for.
      # Under pull_request_target that is what a bare checkout gives, which
      # means a branch can neither weaken these tests nor delete them.
      - uses: actions/checkout@v4
      - run: bats test/ci-runner.bats
        env:
          # Declared, not detected: landing on the wrong runner should fail
          # rather than quietly select a different set of assertions.
          DEJIMA_CI_TIER: confined

  runner-env-privileged:
    runs-on: dejima-privileged
    name: runner-env (privileged)
