install            = npm:@anthropic-ai/claude-code
image_dirs         = .claude .claude/projects .claude/file-history
image_files        = .claude/.credentials.json
image_env          = CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
command            = claude
command_path       = /usr/local/share/npm-global/bin/claude
api_domains        = platform.claude.com
guards             = bash-deny push-guard merge-guard notify
no_confirm_args    = --dangerously-skip-permissions
briefing_args      = --append-system-prompt
settings_args      = --settings /etc/dejima-settings.json
# Which model API this harness talks to, and so which credential the host-side
# proxy injects. Per harness rather than global (#171): an operator running
# Claude Code against Anthropic and Cline against something else is the
# ordinary case, and one setting cannot say both.
#
# Defaulted here rather than in core, because "Anthropic" is a fact about this
# harness's usual setup and not about dejima. A harness that has no sensible
# default leaves it unset and the launch says so.
keys               = provider:provider:provider=anthropic projects_dir:path=~/.claude/projects file_history_dir:path=~/.claude/file-history statusline_path:path=~/.claude/statusline.sh
resume_command     = claude --resume {{session_id}}
briefing           = briefing.md
