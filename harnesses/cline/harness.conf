# Cline's CLI. See docs/development.md, "Worked example: Cline", for how each
# of these was established - every one of them by running it, not by reading
# its documentation, which is wrong about where rules live on Linux.
#
# Needs AVX2: the published binary is Bun-embedded and Bun's default build
# requires it, so a VM whose CPU model is x86-64-v2-AES gets SIGILL before any
# output. .dejima/dependencies carries the same note.
install            = npm:cline

# .cline is Cline's config dir and .cline/data its state; both are declared so
# they exist owned by the sandbox user rather than being created as root when
# Docker sets up the state mount over the second one.
#
# Documents/Cline/Rules is where the briefing is staged. That path is not a
# guess and not what Cline's documentation says: ~/Documents/Cline/Rules
# reaches the model on Linux and ~/Cline/Rules does not.
image_dirs         = .cline .cline/data Documents Documents/Cline Documents/Cline/Rules

# DO_NOT_TRACK and DISABLE_TELEMETRY are both honoured; CLINE_NO_AUTO_UPDATE
# stops a session upgrading its own harness mid-run, which would replace a
# binary the image pinned with one nothing reviewed.
image_env          = DO_NOT_TRACK=1 DISABLE_TELEMETRY=1 CLINE_NO_AUTO_UPDATE=1

command            = cline
command_path       = /usr/local/share/npm-global/bin/cline

# Nothing is fetched at startup: the whole assessment ran against a loopback
# endpoint with the firewall up, so there is no catalogue or feature-flag host
# to allowlist. Cline's own endpoints (api.cline.bot and friends) are
# deliberately absent - a session that falls back to them has lost its
# provider configuration, and failing to connect is the right outcome.
api_domains        =

# Only meaningful on the Anthropic path, where Cline is pointed at the real
# hostname with a placeholder key and dejima's terminator and host-side proxy
# supply the credential. Confirmed end to end. On the local-endpoint path
# nothing connects here and pinning it costs nothing.
proxied_api_domain = api.anthropic.com

# None. Cline registers no hook that can refuse a tool call, so bash-deny has
# nowhere to live, and it has no session lifecycle signal dejima can turn into
# a notification. push-guard and merge-guard are not listed because no harness
# hosts them any more - they are PATH shadows and hold regardless. Launch
# names what this costs; see harness_report_guards.
guards             =

# R3. Cline registers no session-start hook, so the briefing is a file, and
# this is the path that reaches the model - established by running it, not by
# reading the documentation, which says ~/Cline/Rules. On Linux that directory
# is ignored; ~/Documents/Cline/Rules is read. entrypoint.sh renders the
# briefing here root-owned and read-only.
briefing_path      = Documents/Cline/Rules/00-dejima.md

no_confirm_args    = --auto-approve true

# state_dir follows epitaph.dir and audit.dir: dejima's own state, one
# directory per workspace slug. Cline's state is not sliced by project - one
# sessions.db indexes every session it has ever run - so there is no
# per-project subtree of the operator's own ~/.cline/data to mount, and giving
# each project its own data directory is what keeps #104 shut here.
#
# model has no default on purpose. Anything shipped here is a model id that
# goes stale with the next Cline release, and choosing the model an unattended
# agent runs on is the operator's call. Absent, the launch refuses and says so.
#
# base_url absent means the Anthropic path through dejima's credential proxy.
# Set, it means a self-hosted endpoint, and the plugin refuses one that is not
# host-local - see bin/harness/cline.sh for why that is an R5 check.
keys               = state_dir:path=~/.local/share/dejima/cline model:?identifier base_url:?url

# Deliberately empty: resuming needs the state directory's path as well as the
# session id, briefing placeholders do not nest, and `template` forbids the
# "=" an environment variable assignment needs. briefing.md carries the whole
# command instead, where both placeholders resolve.
resume_command     =
briefing           = briefing.md
