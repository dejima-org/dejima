# Not meant to be run directly with plain `docker compose up`: WORKSPACE_DIR,
# SSH_AUTH_SOCK, etc. must point at real host paths for a specific project.
# Use `bin/dejima <path-to-project>` instead, which sets these and
# invokes this file.

# Pinned explicitly: bin/dejima-allow discovers running sandboxes
# via the com.docker.compose.project label, which otherwise derives from
# this file's directory name ("docker") and would never match the
# "dejima" value that script filters on.
name: dejima

services:
  # Named for what it is, not for one harness: the image this builds and
  # runs is whichever harness [core] harness selected, and bin/dejima refers
  # to this service by name for both.
  sandbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        TZ: ${TZ:-UTC}
        # Matches the container's own user to the real host user - see
        # Dockerfile. Defaults reproduce today's node/1000/1000//home/node
        # exactly if these aren't set (e.g. building directly, bypassing
        # bin/dejima).
        SANDBOX_USER: ${SANDBOX_USER:-node}
        SANDBOX_UID: ${SANDBOX_UID:-1000}
        SANDBOX_GID: ${SANDBOX_GID:-1000}
        SANDBOX_HOME: ${HOME:-/home/node}
    # Tagged per-user, not a fixed :latest - bin/dejima explicitly
    # builds this image before the run step below, and two different
    # accounts on a shared devbox building from their own checkouts would
    # otherwise silently overwrite each other's image under the same tag.
    # $SANDBOX_IMAGE lets bin/dejima point a run at a derived,
    # per-project image instead, without this build ever producing one
    # under that name itself - see bin/dejima.
    image: ${SANDBOX_IMAGE:-dejima:${SANDBOX_USER:-node}}
    # Run tini as PID 1 so orphaned processes get reaped. Without it PID 1 is
    # the session's own command (claude, or nvim under SANDBOX_NVIM_CONFIG),
    # which never reaps: every process-substitution child the test suite and
    # bin/ scripts leave behind - `dejima-audit compare` alone leaks
    # ten per run - becomes a permanent zombie, and a long session eventually
    # exhausts the cgroup pids limit and can no longer fork at all.
    init: true
    # An explicit floor rather than Docker's default set plus two. The default
    # carries about fourteen capabilities and this container uses seven: it
    # writes and chowns files, runs the firewall, drops privilege twice (gosu
    # for the session, `ulogd -u` for the log daemon), and signals dnsmasq.
    # FSETID, MKNOD, SETFCAP, SETPCAP, SYS_CHROOT, AUDIT_WRITE and
    # NET_BIND_SERVICE are used by nothing here - the last one because the
    # sysctl below is what lets the TLS terminator bind :443 unprivileged.
    #
    # KILL is the one worth explaining, because it is not obvious from reading
    # entrypoint.sh and was missing from the first version of this list. It is
    # not for anything the entrypoint does. `dejima-allow --container` adds a
    # domain to a RUNNING session by appending a server= line and sending
    # dnsmasq a SIGHUP, from outside via docker exec - and dnsmasq drops to its
    # own user (`user=dnsmasq`), so root in this container cannot signal it
    # without CAP_KILL. Without this line, adding a domain mid-session fails
    # with "Operation not permitted", which is a documented feature every
    # session briefing tells the agent to ask for.
    #
    # The general lesson, since the next capability will be the same shape:
    # what the container needs is not only what its entrypoint does. Things
    # reach into it later.
    #
    # This narrows the ROOT phase. The session user's capabilities were already
    # empty: they are cleared on the gosu drop, which runtime.bats asserts by
    # reading CapEff of the running process. What this adds is that the set was
    # never there to be regained.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    # No path back up. gosu drops privilege rather than gaining it, so this
    # does not interfere with it - what it forbids is a setuid binary or a file
    # capability raising privileges on exec, which is the shape any escalation
    # from the session user would have to take. The gosu claim becomes
    # structural instead of only observed.
    security_opt:
      - no-new-privileges:true
    # The credential-proxy TLS terminator binds :443 as the unprivileged
    # sandbox user (see entrypoint.sh). Docker already defaults this to 0, but
    # pinning it makes the dependency explicit: a future default change then
    # fails the launch instead of silently breaking the credential path.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      # The forge's own env vars (declared by its manifest's env_export) and
      # the DEJIMA_* resolved values (DEJIMA_FORGE_HOSTS, DEJIMA_PUSH_HOSTS,
      # ...) are NOT declared here - bin/dejima passes them as `-e` flags at
      # run time instead (see forge_env_exports in dejima-provider-lib.sh),
      # so this file never has to know any forge's variable names. Declaring
      # them here too as ${VAR:-} would only interpolate them to empty:
      # bin/dejima does not export them into its own environment for compose
      # to read.
      #
      # Read-only fine-grained GitHub PAT (Contents + Metadata: read-only,
      # no write scopes). Used by `gh` and, via `gh auth setup-git`, by git
      # itself for github.com over HTTPS - see the firewall/Dockerfile for
      # why that's the only path GitHub is reachable through at all.
      GH_TOKEN: ${GH_TOKEN:-}
      # Points git at the gitconfig copy mounted below instead of the
      # default ~/.gitconfig - see that mount's comment for why it can't
      # just live at ~/.gitconfig directly.
      GIT_CONFIG_GLOBAL: ${HOME}/.gitconfig-sandbox/.gitconfig
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
      # What actually runs as the sandbox user - the selected harness's own
      # command unless [core] command overrides it. See entrypoint.sh and
      # bin/dejima's SANDBOX_NVIM_CONFIG.
      # No default: bin/dejima sets this from the selected harness's
      # manifest, and a literal here would name one harness in a file shared
      # by all of them. entrypoint.sh refuses an empty one rather than
      # guessing.
      SANDBOX_CMD: ${SANDBOX_CMD:-}
      # The selected harness's manifest, resolved host-side: which command
      # the wrapper shadows, the real binary behind it, the flags that make
      # the session unattended, and how this harness is told to read dejima's
      # settings layer. Nothing about a harness is baked into the image.
      SANDBOX_HARNESS_COMMAND: ${SANDBOX_HARNESS_COMMAND:-}
      SANDBOX_HARNESS_REAL: ${SANDBOX_HARNESS_REAL:-}
      SANDBOX_HARNESS_ARGS: ${SANDBOX_HARNESS_ARGS:-}
      SANDBOX_HARNESS_SETTINGS: ${SANDBOX_HARNESS_SETTINGS:-}
      # The names this harness needs reachable, and the one its credential
      # proxy stands in front of - see docker/fixed-domains.sh.
      SANDBOX_HARNESS_DOMAINS: ${SANDBOX_HARNESS_DOMAINS:-}
      SANDBOX_HARNESS_PROXIED_DOMAIN: ${SANDBOX_HARNESS_PROXIED_DOMAIN:-}
      SANDBOX_HARNESS_BRIEFING_ARGS: ${SANDBOX_HARNESS_BRIEFING_ARGS:-}
      SANDBOX_HARNESS_BRIEFING_PATH: ${SANDBOX_HARNESS_BRIEFING_PATH:-}
      SANDBOX_HARNESS_SEED: ${SANDBOX_HARNESS_SEED:-}
      # Opt-in escape hatch from the default hard GitHub-push block - see
      # init-firewall.sh and git-push-guard.sh. Off unless explicitly set.
      ALLOW_GITHUB_PUSH: ${ALLOW_GITHUB_PUSH:-0}
      # Base URL of a Loki push endpoint (e.g. http://192.0.2.10:3100) to
      # ship DNS-query and firewall allow/reject logs to. Its host is
      # automatically firewall-allowlisted (see entrypoint.sh). Optional -
      # logging is skipped entirely if unset.
      LOKI_URL: ${LOKI_URL:-}
      SSH_AUTH_SOCK: /ssh-agent
      ENABLE_FIREWALL: ${ENABLE_FIREWALL:-1}
      # Docker's own tty allocation defaults to a generic TERM (e.g. plain
      # "xterm", dropping 256-color and any extended-keys terminfo bits),
      # not whatever the host's actual terminal/tmux session is using.
      # Forward the real value so nvim negotiates key sequences (e.g. the
      # Ctrl-H/Backspace disambiguation a tmux config may set up) against
      # the terminfo entry the rest of the chain actually expects.
      TERM: ${TERM:-xterm-256color}
      # Host-side credential proxy (see bin/dejima and docs/security.md):
      # the real OAuth credential stays on the host, injected per-request by
      # the proxy. In the default tls transport Claude Code gets no
      # ANTHROPIC_* values at all - api.anthropic.com is pointed at an
      # in-container TLS terminator instead, so the session carries no
      # environment fingerprint. The pair below is only populated in the
      # loopback transport (the documented cert-pinning fallback), and is
      # empty - and unset by entrypoint.sh - otherwise.
      ANTHROPIC_BASE_URL: ${SANDBOX_ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${SANDBOX_ANTHROPIC_AUTH_TOKEN:-}
      SANDBOX_ANTHROPIC_PROXY_SOCKET: ${SANDBOX_ANTHROPIC_PROXY_SOCKET:-}
      SANDBOX_ANTHROPIC_TRANSPORT: ${SANDBOX_ANTHROPIC_TRANSPORT:-}
    volumes:
      # Mounted at the same absolute path as on the host (rather than a
      # fixed /workspace) so Claude Code's project/session-history keying
      # (based on cwd) lines up with the host, letting a session started
      # here be resumed on the host with `claude --resume`.
      - ${WORKSPACE_DIR:?set WORKSPACE_DIR to the project directory to mount}:${WORKSPACE_DIR}
      # ~/.claude is enumerated, never mounted whole. A single-file bind
      # mount is pinned to the dentry at its path, so a host-side rename -
      # a sync daemon, or Claude Code's own atomic writes - unlinks it, the
      # mount detaches silently, and the path falls through to the real
      # writable host file (#47, #48; #50 did exactly that to the
      # .credentials.json mask). Anything not listed here is
      # container-local, which is the safer default but means new state that
      # should persist has to be added deliberately.
      #
      # Read-write below, and all directories: a directory mount can't
      # detach that way, because a rename replaces an entry within it rather
      # than the mount point itself.
      #
      # projects/ and file-history/ are absent on purpose - the trees are
      # every project's memory and every project's file contents, and a
      # write into either reaches sessions elsewhere (#104). bin/dejima
      # mounts this workspace's own entries, one -v each; see
      # bin/dejima-slug-lib.sh for how that set is chosen.
      # The harness's own configuration directories and staged files are not
      # here: which those are is a fact about the harness, so its plugin
      # declares them and bin/dejima mounts them. See harness_config_dirs
      # and harness_staged_config in bin/harness/<name>.sh.
      # The sandbox's own settings overrides (sandbox.enabled off, plus the
      # remote-access notify hooks when that's on), generated per run by
      # bin/dejima and reaching the harness as harness-wrapper.sh's
      # --settings argument. A container-local path, like the staged config
      # above and for the same reason (#47) - and separate from that staging
      # directory because this file is generated per run rather than copied
      # from the host, and it stays mounted rather than being copied in.
      - ${SANDBOX_SETTINGS_FILE:?set by bin/dejima}:/etc/dejima-settings.json:ro
      # A throwaway per-session copy, not the real file - see
      # bin/dejima and README "Throwaway ~/.claude.json". A plain
      # read-only mount hangs Claude Code on startup (it writes to this
      # file before login completes), so this can't just be layered
      # read-only the way plugins/hooks/skills are above;
      # a generated, discarded copy is what actually stops a compromised
      # session's changes (e.g. a malicious mcpServers entry) from ever
      # reaching the real file.
      - ${SANDBOX_CLAUDE_JSON_FILE:?set by bin/dejima}:${HOME}/.claude.json
      # Global git identity (user.name/user.email) - a throwaway copy of it,
      # in its own directory rather than a single file bind-mounted at
      # ~/.gitconfig: entrypoint.sh's `gh auth setup-git` writes a
      # credential-helper entry into it via git's usual write-temp-then-
      # rename pattern, which fails on a single-file mount ("Device or
      # resource busy" - Linux won't let that mount point's backing inode be
      # replaced). GIT_CONFIG_GLOBAL above points git at the file inside
      # this directory instead. See bin/dejima - nothing written
      # here ever reaches the user's real ~/.gitconfig.
      - ${SANDBOX_GITCONFIG_DIR:?set by bin/dejima}:${HOME}/.gitconfig-sandbox
      # ~/.claude/hooks contains symlinks whose targets live outside
      # ~/.claude itself (this repo's hooks/, and potentially others, e.g.
      # another config repo's hooks/) - those targets are bind-mounted at
      # their own real host paths dynamically by bin/dejima at
      # launch (it inspects the symlinks and appends the exact mounts
      # needed), not listed statically here, since this repo can't assume
      # what else might be installed on a given host.
      - dejima-bashhistory:/commandhistory
      - nvim-data:${HOME}/.local/share/nvim
      - nvim-state:${HOME}/.local/state/nvim
      - nvim-cache:${HOME}/.cache/nvim
      # Required only if SANDBOX_SSH_KEY isn't set - bin/dejima
      # itself enforces that at least one of the two is present.
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
      - ${SSH_KNOWN_HOSTS:-/dev/null}:${HOME}/.ssh/known_hosts:ro
      # Dedicated, purpose-built key for headless git push - see README
      # "Headless git push without agent forwarding". Read-only single-file
      # mount is fine here (unlike the gitconfig mount above): nothing in
      # the container ever writes to this file. Mounted under /root (700,
      # root:root by default), not under $SANDBOX_HOME: the sandbox user's
      # UID now matches the host user's (see Dockerfile), so a mount here
      # under their own home would leave the raw key readable by that user
      # for the container's whole life, even after entrypoint.sh's copy is
      # deleted - only root (which loads it into the agent, then never
      # touches it again) can reach this path.
      - ${SANDBOX_SSH_KEY_FILE:-/dev/null}:/root/.ssh-sandbox-key-src:ro
      # Read-write scratch space for passing files back and forth with the
      # sandboxed session (screenshots, temp scripts) without touching the
      # actual project checkout - separate from WORKSPACE_DIR above, and a
      # real host directory (not a named volume) so it's actually visible on
      # both sides, persisting across sessions.
      - ${SANDBOX_SHARE_DIR}:${HOME}/shared
    working_dir: ${WORKSPACE_DIR}
    stdin_open: true
    tty: true

volumes:
  # Shell history, shared by every harness - it is the container's shell that
  # writes it, not the agent.
  dejima-bashhistory:
  # Named explicitly so bin/dejima can give each project its own set. These
  # persist across containers by design (a plugin install should not have to
  # happen every launch), which without the split meant one project's session
  # could leave a Lua file or a mason/bin binary that another project's
  # session executes the next time nvim runs. The service still refers to the
  # static keys; only the volume Docker actually creates varies.
  #
  # The defaults reproduce the previous names exactly, so a `docker compose`
  # invocation that bypasses bin/dejima behaves as it did.
  nvim-data:
    name: ${SANDBOX_NVIM_DATA:-dejima_nvim-data}
  nvim-state:
    name: ${SANDBOX_NVIM_STATE:-dejima_nvim-state}
  nvim-cache:
    name: ${SANDBOX_NVIM_CACHE:-dejima_nvim-cache}
