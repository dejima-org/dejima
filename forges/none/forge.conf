# No forge. Selecting this is the honest way to say "this sandbox pushes
# nowhere", as distinct from a forge whose keys merely aren't filled in yet -
# a distinction the launch-time validation rules depend on being expressible.
#
# Every field is empty rather than absent so that reading this file answers
# the question directly. A workflow requiring any capability is refused
# against it, which is what makes `workflow = local-only` the matching choice.
capabilities =
keys         =
requires     =
