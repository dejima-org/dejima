# A model the operator serves: on the host, or somewhere on the sandbox's own
# network.
#
# The third arrangement, and the only one with no credential anywhere in it.
# Nothing to withhold means no proxy, no terminator and nothing to steal, which
# makes this the strongest posture dejima offers - see docs/security.md.
#
# WHERE it is belongs to the operator rather than to this file, which is why
# base_url is a config key and not a manifest constant. A local endpoint is
# also the one an operator is most likely to keep configured while using
# something else: it lives in [provider.self-hosted] and stays there when the
# selected provider changes.

credential      = none

# No upstream and no proxied_domain: both describe an endpoint dejima stands in
# front of, and it stands in front of nothing here.

# OpenAI-compatible, which is what a self-served model almost always speaks -
# llama.cpp, vLLM, Ollama and LM Studio all expose that shape.
api_style       = openai

# No default. Refusing an unset one at launch beats a session starting against
# an endpoint dejima picked, and there is no address worth guessing: whatever
# is at 127.0.0.1:8080 on somebody else's machine is not this operator's model.
keys            = base_url:?url
requires        = base_url
