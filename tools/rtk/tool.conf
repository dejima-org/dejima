# rtk - a CLI proxy that compresses command output before an agent reads it.
# https://github.com/rtk-ai/rtk, Apache-2.0, a single static Rust binary.
#
# The first optional tool, and the shape every later one has to follow: dejima
# does not install what a project asks for, it installs what it has hardened.
# See docs/tools.md for what that means and what was checked here.
#
# What it is NOT: rtk makes no model calls of its own. It is a deterministic
# output filter - `rtk git status` runs git and prints less of the result - so
# nothing here sends code anywhere.
description   = compresses command output before it reaches the model

# The published release, pinned by digest. Deliberately not the project's
# `curl | sh` installer, which fetches whatever master points at today: an
# image build that produces a different binary each time is one nothing has
# reviewed. The digest was taken from the artifact below and checked against a
# second download.
#
# x86_64 only, which is issue #97's limitation and not this tool's: the
# tarball spec names one architecture and an arm64 host cannot use this entry.
install       = tarball:rtk@c4c036fbf181fc55ef329786c8c17e0d427972b053b825944d968a6aafef1ba4:https://github.com/rtk-ai/rtk/releases/download/v0.45.0/rtk-x86_64-unknown-linux-musl.tar.gz

# The archive is one bare executable with no enclosing directory, where a Go
# or nvim release has everything under one. Stripping a component would strip
# the binary itself and extract nothing.
install_layout = binary

# rtk carries telemetry the README does not mention: an https ping compiled
# into the release binary, gated on a consent flag that defaults to unset.
# Disabled here as well, and the firewall does not allowlist the endpoint, so
# it is off three ways. Verified in the shipped artifact's strings, not only
# in the source - see docs/tools.md.
#
# This carried NO_COLOR=1 as well, reasoning that rtk's output lands in a
# model's context where an escape sequence is noise. The reasoning was fine
# and the mechanism was wrong: a tool's image_env becomes a Dockerfile ENV,
# which every process in the container inherits, so it took the colour out of
# the harness, git, ls and everything else. A tool may only set variables that
# are its own, and core refuses one that is not.
image_env     = RTK_TELEMETRY_DISABLED=1

command       = rtk
instructions  = instructions.md
