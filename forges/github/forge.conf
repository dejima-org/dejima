# GitHub as the FORGE - meaning this sandbox pushes to it and opens PRs there.
# Distinct from the read-only GitHub access every session gets regardless,
# which is a core feature and stays independent of this selection.
#
# push_token_file is deliberately NOT [github] token_file. That one is a
# dedicated read-only fine-grained PAT (see bin/dejima's comment on it):
# promoting it here would turn a credential chosen for being unable to write
# into the one this workflow pushes with. Selecting this forge asks for a
# second, explicitly write-capable token.
#
# fixed_hosts rather than host_keys: these are the same three hosts for every
# operator, so there is nothing to configure and nothing to get wrong. Note
# that selecting this forge opens ssh.github.com:22 for push - a real change
# in posture, documented in docs/providers.md.
capabilities  = pr issues
pr_command    = gh pr
issue_command = gh issue
merge_block   = gh pr merge
keys          = push_token_file:?path
requires      = push_token_file
fixed_hosts   = github.com ssh.github.com api.github.com
install       =
env_export    = GH_TOKEN=@push_token_file
