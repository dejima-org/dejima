# Anthropic on API billing, signed in through Claude Code's own console login.
#
# This is what the "Anthropic Console account" option produces: the web flow
# creates an API token and injects it, and Claude Code stores it as a
# top-level primaryApiKey in ~/.claude.json. Nothing ever shows the operator
# the key, and ~/.claude/.credentials.json stays `{}` - which is why the
# subscription backend cannot serve this login and refuses it.
#
# For a key you hold in a file of your own, see anthropic-api-key.

upstream        = https://api.anthropic.com
proxied_domain  = api.anthropic.com
api_style       = anthropic

credential      = static

# The key is one value in a file of unrelated app state, not the whole file.
# dejima stages ~/.claude.json into the container for its mcpServers and
# project state, and strips this field on the way in, so the container gets
# the surrounding config and none of the credential.
credential_field = primaryApiKey

# Anthropic's own header, bare - no scheme prefix.
auth_header     = x-api-key
auth_format     = {token}

# The other slot, stripped so a placeholder cannot travel beside the injected
# key and be the one the API reads.
strip_headers   = authorization

# Defaulted, unlike anthropic-api-key's: this is not a path the operator
# chose, it is where Claude Code puts it.
keys            = credential_file:path=~/.claude.json
requires        = credential_file
