capabilities  = pr issues
pr_command    = gitea-pr
issue_command = gitea-issue
merge_block   = gitea-pr merge
# Every command that sends a body a person did not write. The wording of the
# marker is core's (docker/forge-guard.sh); this only says which commands carry
# one and what each of them is writing.
disclose      = pr:gitea-pr create, pr:gitea-pr edit, issue:gitea-issue create, issue:gitea-issue edit, comment:gitea-issue comment
# Which of the keys above belong to a PERSON rather than to the project. A
# project's .dejima/ is committed and shared; a token path is per-user and
# per-machine, so a project may not declare one and an [identity.<name>]
# section may set one. One declaration drives both rules, so they cannot
# disagree about which key is which.
identity_keys = token_file
keys          = ssh_host:?hostname api:?url token_file:path=~/.config/gitea/token
requires      = ssh_host api token_file
host_keys     = ssh_host
url_keys      = api
install       = bin/gitea-pr bin/gitea-issue bin/gitea-actions
env_export    = GITEA_API=api GITEA_SSH_HOST=ssh_host GITEA_TOKEN=@token_file
