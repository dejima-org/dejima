# Anthropic, on a subscription login: the OAuth credential Claude Code writes
# on the host.
#
# The refreshing kind. The token expires, so the proxy renews it against the
# endpoint below and writes the rotated one back to the host file - which is
# what keeps a host-side login working rather than being signed out by a
# sandbox run. For a console key on API billing, see anthropic-api-key.

upstream        = https://api.anthropic.com

# What the in-container TLS terminator answers for, and what /etc/hosts pins to
# loopback. On the backend rather than the harness, because it is a property
# of the endpoint: the same harness reaches a different one when a different
# backend is selected, and the terminator has to follow the endpoint.
proxied_domain  = api.anthropic.com

# The Messages API, which is not OpenAI-compatible. A harness pointed here has
# to speak it; one that cannot is refused at launch rather than sending
# well-formed requests in the wrong shape.
api_style       = anthropic

credential      = anthropic-oauth
oauth_endpoint  = https://platform.claude.com/v1/oauth/token
oauth_client_id = 9d1c250a-e61b-44d9-88ed-5944d1962f5e

auth_header     = Authorization
auth_format     = Bearer {token}

# x-api-key must not travel beside the injected Authorization: two answers to
# the same question, and which one the API prefers is not dejima's to guess.
# The container only ever holds a placeholder, so what this prevents is a
# placeholder being the one that gets read.
strip_headers   = x-api-key

# The API rejects an OAuth token without it. Merged into whatever the client
# already sent rather than replacing it, and left completely alone when the
# value is already there - see the proxy's comment on why re-joining a list
# that needs no change is itself a fingerprint.
ensure_headers  = anthropic-beta=oauth-2025-04-20

# Claude Code's own credential file, which is where the OAuth blob lives. A
# path, never a secret: the file is read host-side per request and is not
# mounted into the container.
keys            = credential_file:path=~/.claude/.credentials.json
requires        = credential_file
