# Anthropic, on API billing: a console key rather than a subscription login.
# This is what most organisations put their people on.
#
# A static credential against the same endpoint the subscription backend uses,
# so it needs no machinery of its own - the proxy injects whatever header a
# backend names, in whatever shape it names.

upstream        = https://api.anthropic.com
proxied_domain  = api.anthropic.com
api_style       = anthropic

credential      = static

# Anthropic's own header, and the key goes in bare - no scheme prefix. This is
# the pair the OAuth backend does NOT use, which is the whole difference
# between the two: an OAuth token is a Bearer, an API key is x-api-key.
auth_header     = x-api-key
auth_format     = {token}

# The other slot, stripped so a placeholder cannot travel beside the injected
# key. Two answers to the same question and which one the API prefers is not
# dejima's to guess - and here the wrong answer is the placeholder.
strip_headers   = authorization

# No default. A console key has no conventional location the way a login's
# credential file does, and guessing at one would point dejima at a file it
# has no reason to think exists.
keys            = credential_file:?path
requires        = credential_file
