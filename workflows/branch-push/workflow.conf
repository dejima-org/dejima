requires          =
push              = on
blocked_branches  = main master
# This said "off" and gave a reason: nothing here ever reaches a forge's PR
# interface, so there is no merge command to block. The premise is false. What
# the briefing tells the agent to do and what the image puts on its PATH are
# different things - select forge = gitea and `gitea-pr merge` is present
# whatever the workflow says, because the CLI is installed by the forge, not
# by the workflow. This workflow's own briefing says "do not merge anything",
# and until now nothing held it to that.
block_merge       = on
requires_worktree = on
autonomy          = push-branch
briefing          = briefing.md
