# blocked_branches is empty BECAUSE push is off. The two are coupled: turning
# push on without filling this in would silently allow a push to main.
requires          =
push              = off
blocked_branches  =
# On for the same reason branch-push's is: this workflow may be selected
# alongside a forge, its briefing says "do not open pull requests and do not
# merge", and the forge's CLI is on PATH regardless of what the workflow tells
# the agent to do. A briefing that states a rule while the manifest leaves the
# guard off is asserting something nothing holds.
block_merge       = on
requires_worktree = off
autonomy          = commit
briefing          = briefing.md
